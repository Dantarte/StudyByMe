<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>DANTAHIBOU V51</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root { 
            --bg: #000; --app-bg: #161b22; --text: #abb2bf;
            --blue: #61afef; --green: #98c379; --red: #ff4444; --border: #30363d;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .wrapper { width: 100%; max-width: 800px; margin: 0 auto; position: relative; display: flex; flex-direction: column; height: 100%; }

        header {
            padding-top: calc(var(--safe-top) + 15px); padding-left: 20px; padding-right: 20px; padding-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(13, 17, 23, 0.9); border-bottom: 1px solid var(--border);
            flex-shrink: 0; z-index: 200; backdrop-filter: blur(10px);
        }
        .icon-btn { color: var(--text); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s; }
        .icon-btn:hover { color: #fff; }
        
        .repo-icon { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
        .repo-icon span { display: block; height: 2px; background: currentColor; border-radius: 1px; transition: 0.2s; }
        .repo-icon span:nth-child(1) { width: 16px; }
        .repo-icon span:nth-child(2) { width: 10px; }
        .repo-icon span:nth-child(3) { width: 14px; }

        .side-panel {
            position: fixed; top: 0; bottom: 0; background: rgba(0,0,0,0.96);
            z-index: 5000; display: none; flex-direction: column; padding: 60px 25px; backdrop-filter: blur(15px); overflow-y: auto;
        }
        .side-panel.active { display: flex; }
        .panel-item { padding: 18px 0; border-bottom: 1px solid var(--border); font-size: 1.05rem; color: #fff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .panel-item.active { color: var(--blue); font-weight: bold; }
        .close-btn { position: absolute; top: 30px; right: 25px; font-size: 2rem; color: #5c6370; padding: 10px; cursor: pointer; }

        #main-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 20px 120px 20px; position: relative; }
        
        .word-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0 10px; }
        #word-text { font-size: 2.2rem; font-weight: 200; color: #fff; text-align: center; line-height: 1.2; word-wrap: break-word; }
        #fav-btn { font-size: 1.8rem; cursor: pointer; color: #5c6370; }
        
        #hint-text { font-size: 0.75rem; color: #5c6370; text-align: center; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 35px; }

        .opts-grid { display: grid; gap: 15px; width: 100%; margin-bottom: 30px; }
        button.choice { background: var(--app-bg); color: var(--text); border: 1px solid var(--border); padding: 20px 15px; font-size: 1rem; border-radius: 12px; text-align: left; line-height: 1.4; cursor: pointer; }
        button.choice.correct { background: var(--green) !important; color: #000 !important; font-weight: bold; }
        button.choice.wrong-shake { animation: shake 0.4s; border-color: var(--red) !important; color: var(--red) !important; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .input-box { background: rgba(0,0,0,0.5); border: none; border-bottom: 2px solid var(--blue); color: #fff; font-size: 1.5rem; text-align: center; width: 100%; padding: 15px 0; display: none; margin-bottom: 20px; }

        footer {
            position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 800px; margin: 0 auto;
            background: #0d1117; border-top: 1px solid var(--border);
            padding-bottom: calc(var(--safe-bottom) + 15px); padding-top: 15px; display: flex; justify-content: center; gap: 80px; z-index: 300;
        }
        .footer-btn { background: none; border: none; color: #5c6370; font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; font-weight: bold; padding: 10px; cursor: pointer; }

        .progress { position: fixed; top: calc(var(--safe-top) + 70px); left: 0; width: 100%; height: 2px; background: #000; z-index: 150; }
        #bar-fill { height: 100%; background: var(--blue); width: 0%; transition: 0.4s; }

        /* 主控大厅 Mirror Mirror */
        #import-center { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: flex; flex-direction: column; padding: calc(var(--safe-top) + 40px) 25px; overflow-y: auto; align-items: center; }
        .dashboard-content { width: 100%; max-width: 500px; display: flex; flex-direction: column; padding-bottom: 50px;}
        
        .archive-card { background: #0d1117; border: 1px solid var(--border); border-radius: 12px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .archive-card:hover { border-color: var(--blue); }
        .archive-card.active-card { border-color: var(--green); background: rgba(152, 195, 121, 0.05); }
        .archive-title { font-weight: bold; font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
        .archive-meta { font-size: 0.75rem; color: #5c6370; }

        textarea.paste-area { width: 100%; height: 120px; background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 12px; font-size: 1rem; margin-bottom: 15px; resize: none; font-family: inherit;}
        .btn-main { background: var(--blue); color: #000; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        .modal-full { position: fixed; inset: 0; background: var(--bg); z-index: 6000; display: none; flex-direction: column; padding: 60px 20px; overflow-y: auto; }
        .list-row { padding: 18px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        /* 激烈报错 (C1/C2) */
        #toast-alert {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.95); color: var(--red); font-weight: 300; letter-spacing: 2px; font-size: 0.85rem;
            padding: 12px 28px; border-radius: 8px; border: 1px solid rgba(255, 68, 68, 0.6);
            z-index: 10000; backdrop-filter: blur(10px); transition: top 0.4s; pointer-events: none; display: flex; align-items: center; gap: 10px;
        }
        #toast-alert.show { top: calc(var(--safe-top) + 85px); }

        /* V51 治愈系防呆提示 (C3) - 完全两行，独立间距 */
        #gentle-toast {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.98); 
            padding: 25px 50px; border-radius: 16px; border: 1px solid #30363d;
            z-index: 10000; backdrop-filter: blur(15px); box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 200px;
        }
        #gentle-toast.show { top: calc(var(--safe-top) + 120px); }
        
        .proj-badge { font-size: 0.65rem; background: #1c2128; color: var(--text); padding: 4px 8px; border-radius: 6px; margin-left: 8px; border: 1px solid var(--border); }
        
        /* 现代极简 Action Icons */
        .action-icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; width: 18px; height: 18px; }
        .action-btn { background: none; border: none; color: #5c6370; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .action-btn.edit:hover { color: var(--blue); }
        .action-btn.del:hover { color: var(--red); }
        .action-group { display: flex; gap: 5px; align-items: center; }

        @media (max-width: 767px) { .side-panel { left: 0; right: 0; } }
        @media (min-width: 768px) {
            #word-text { font-size: 2.8rem; } 
            #panel-left { left: 0; right: auto; width: 380px; border-right: 1px solid var(--border); }
            #panel-right { right: 0; left: auto; width: 450px; border-left: 1px solid var(--border); }
            .opts-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="toast-alert">✕ WRONG</div>
<div id="gentle-toast">
    <div style="font-size: 1.1rem; font-weight: 300; letter-spacing: 4px; color: #fff; margin-bottom: 12px;">再试一次</div>
    <div style="font-size: 0.65rem; color: #5c6370; letter-spacing: 3px; font-family: monospace;">TAKE YOUR TIME</div>
</div>

<div class="wrapper">
    <header>
        <div class="icon-btn" style="font-size: 1.5rem;" onclick="openPanel('left')">☰</div>
        <div style="text-align: center;">
            <div style="font-size: 0.85rem; font-weight: bold; letter-spacing: 3px; color: var(--blue); text-transform: uppercase;">DANTAHIBOU</div>
            <div id="current-project-name" style="font-size: 0.5rem; color: #5c6370; letter-spacing: 1px; margin-top: 3px;"></div>
        </div>
        <div class="icon-btn" onclick="openPanel('right')"><div class="repo-icon"><span></span><span></span><span></span></div></div>
    </header>

    <div class="progress"><div id="bar-fill"></div></div>

    <main id="main-container">
        <div class="word-header">
            <div id="word-text">---</div>
            <div id="fav-btn" onclick="toggleFavCurrent()">☆</div>
        </div>
        <div id="hint-text">Waiting</div>
        <div class="opts-grid" id="btns"></div>
        <input type="text" id="spell-box" class="input-box" placeholder="TYPE & ENTER" autocomplete="off" autocapitalize="off">
        <textarea id="roleplay-box" class="input-box" style="font-size:1rem; text-align:left; height:120px; resize:none; padding:15px; border:1px solid var(--border); border-radius:8px; font-family:inherit;" placeholder="Write a sentence using this term..."></textarea>
        <button id="submit-rp" class="btn-main" style="display:none; margin: 15px auto 0; max-width: 200px;" onclick="move(true)">SUBMIT</button>
    </main>

    <footer>
        <button class="footer-btn" onclick="skip()">SKIP</button>
        <button class="footer-btn" onclick="archiveCurrent()" style="color:var(--blue)">ARCHIVE</button>
    </footer>
</div>

<div id="panel-left" class="side-panel">
    <div class="close-btn" onclick="closePanel('left')">✕</div>
    <h3 style="color:var(--blue); font-weight: 200; margin-bottom: 25px; text-transform: uppercase;">Set Mode</h3>
    <div class="panel-item" onclick="setCircle(1)" id="m1">Circle 1: 识别 (Identify)</div>
    <div class="panel-item" onclick="setCircle(2)" id="m2">Circle 2: 回想 (Recall)</div>
    <div class="panel-item" onclick="setCircle(3)" id="m3">Circle 3: 拼写 (Spelling)</div>
    <div class="panel-item" onclick="setCircle(4)" id="m4">Circle 4: 实战 (Role-play)</div>
    
    <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 10px;">
        <div class="panel-item" onclick="toggleRandom()">随机模式 <span id="rand-status" style="color:#5c6370">OFF</span></div>
        <div class="panel-item" onclick="toggleFavMode()">收藏训练 <span id="fav-status" style="color:#5c6370">OFF</span></div>
        <div class="panel-item" onclick="showImporter()" style="color:var(--blue); margin-top:20px; border:none; justify-content:center;">+ 切换 / 新建项目</div>
    </div>
</div>

<div id="panel-right" class="side-panel">
    <div class="close-btn" onclick="closePanel('right')">✕</div>
    <h3 style="color:var(--blue); font-weight: 200; margin-bottom: 25px; text-transform: uppercase;">Library</h3>
    <div id="project-list-area" style="margin-bottom: 30px;">
        <div style="font-size: 0.7rem; color: #5c6370; margin-bottom: 15px; letter-spacing: 1px;">PROJECTS 项目存档</div>
        <div id="projects-container"></div>
    </div>
    
    <div style="font-size: 0.7rem; color: #5c6370; margin-bottom: 10px; letter-spacing: 1px; border-top: 1px solid var(--border); padding-top: 20px;">CURRENT DATA 当前数据</div>
    <div class="panel-item" onclick="showList('all')">全量清单 (Full List)</div>
    <div class="panel-item" onclick="showList('arc')">归档仓库 (Archive)</div>
</div>

<div id="import-center">
    <div class="dashboard-content">
        <h1 style="font-weight: 200; margin-bottom: 10px; color:#fff; letter-spacing: 4px; text-align: center;">DANTAHIBOU</h1>
        <div style="text-align: center; color: #5c63
